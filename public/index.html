<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="CMPLX-AI">
  <title>CMPLX-AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Ubuntu+Mono:wght@400;700&family=Inconsolata:wght@300;400;500;600;700&family=Anonymous+Pro:wght@400;700&family=Overpass+Mono:wght@300;400;500;600;700&family=Share+Tech+Mono&family=VT323&family=Azeret+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-symbol">C</div>
      <div>
        <div class="brand-name">CMPLX-AI</div>
        <div class="brand-sub">intelligence / online</div>
      </div>
    </div>

    <button class="new-chat" id="newChat"><span>+</span> new chat</button>

    <div class="side-label">chats</div>
    <div id="chatList" class="chat-list"></div>

    <div class="sidebar-bottom">
      <button class="side-action" id="settingsButton"><span>⚙</span> settings</button>
      <div class="connection"><i></i><span>system online</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <button class="mobile-menu" id="mobileMenu">☰</button>
      <div>
        <div class="page-title">CMPLX-AI</div>
        <div class="page-status"><i></i> ready</div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="exportButton" title="Export chat">↓</button>
        <button class="icon-button" id="clearButton" title="Clear chat">×</button>
      </div>
    </header>

    <section class="conversation" id="conversation">
      <div class="welcome" id="welcome">
        <div class="hero-mark">C</div>
        <h1>CMPLX-AI</h1>
        <p>advanced intelligence for code, systems, and whatever you're building.</p>

        <div class="prompt-grid">
          <button data-prompt="Build me a complete project and explain how to run it.">
            <b>build</b><span>create something from scratch</span>
          </button>
          <button data-prompt="Debug this code and explain exactly what is wrong.">
            <b>debug</b><span>find and fix the problem</span>
          </button>
          <button data-prompt="Give me a secure, production-ready implementation for this idea.">
            <b>secure</b><span>design it with security in mind</span>
          </button>
          <button data-prompt="Explain this technical concept like I already know the basics.">
            <b>explain</b><span>technical answers without the fluff</span>
          </button>
        </div>
      </div>
    </section>

    <div class="composer-area">
      <form class="composer" id="composer">
        <div class="composer-tools">
          <button type="button" id="attachButton" title="Attach files">+</button>
          <input id="fileInput" type="file" multiple hidden>
        </div>
        <textarea id="message" rows="1" placeholder="message CMPLX-AI..." autofocus></textarea>
        <button class="send" id="sendButton" type="submit" title="Send">↑</button>
      </form>
      <div class="composer-meta">
        <span>CMPLX-AI · drag files here to attach</span>
        <span><kbd>Enter</kbd> send · <kbd>Shift</kbd> + <kbd>Enter</kbd> newline · <kbd>Esc</kbd> stop</span>
      </div>
    </div>
  </main>

  <dialog id="settings">
    <div class="dialog-head">
      <div>
        <div class="dialog-title">settings</div>
        <div class="dialog-sub">local preferences</div>
      </div>
      <button class="icon-button" id="closeSettings">×</button>
    </div>

    <label class="setting">
      <span>font</span>
      <select id="fontSelect">
        <option value="Geist Mono">Geist Mono</option>
        <option value="IBM Plex Mono">IBM Plex Mono</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
        <option value="Fira Code">Fira Code</option>
        <option value="Source Code Pro">Source Code Pro</option>
        <option value="Roboto Mono">Roboto Mono</option>
        <option value="Space Mono">Space Mono</option>
        <option value="Ubuntu Mono">Ubuntu Mono</option>
        <option value="Inconsolata">Inconsolata</option>
        <option value="Anonymous Pro">Anonymous Pro</option>
        <option value="Overpass Mono">Overpass Mono</option>
        <option value="Share Tech Mono">Share Tech Mono</option>
        <option value="VT323">VT323</option>
        <option value="Azeret Mono">Azeret Mono</option>
        <option value="monospace">System Monospace</option>
      </select>
    </label>

    <label class="setting">
      <span>font size</span>
      <input id="fontSize" type="range" min="12" max="18" value="14">
      <output id="fontSizeValue">14px</output>
    </label>

    <label class="setting check">
      <input id="compactMode" type="checkbox">
      <span>compact messages</span>
    </label>

    <label class="setting check">
      <input id="enterSend" type="checkbox" checked>
      <span>Enter sends message</span>
    </label>

    <label class="setting">
      <span>profile</span>
      <select id="profileSelect">
        <option value="general">General</option>
        <option value="coding">Coding</option>
        <option value="debugging">Debugging</option>
        <option value="cybersecurity">Cybersecurity</option>
        <option value="linux">Linux</option>
        <option value="web">Web Development</option>
      </select>
    </label>

    <label class="setting">
      <span>theme</span>
      <select id="themeSelect">
        <option value="midnight">Midnight</option>
        <option value="carbon">Carbon</option>
        <option value="ice">Ice</option>
        <option value="amoled">AMOLED</option>
        <option value="terminal">Terminal</option>
      </select>
    </label>

    <div class="usage-stats">
      <div><span>messages</span><b id="statMessages">0</b></div>
      <div><span>characters</span><b id="statChars">0</b></div>
      <div><span>generations</span><b id="statGenerations">0</b></div>
    </div>

    <button class="reset-settings" id="resetSettings">reset settings</button>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
